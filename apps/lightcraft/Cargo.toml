[package]
name = "lightcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "lightcraft"

[lints.rust]
unsafe_code = "deny"

[dependencies]
lightcraft-engine = { workspace = true }
lightcraft-sysmem = { workspace = true }
lightcraft-ui-egui = { workspace = true }
lightcraft-codecs = { workspace = true }
lightcraft-raster = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for lightcraft.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true }

[lib]
path = "src/main.rs"
crate-type = ["cdylib"]

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
rfd = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
craft-android = { package = "craft-android", path = "../../platform/android" }
lightcraft-catalog = { workspace = true }
eframe = { workspace = true, features = ["android-game-activity"] }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"
